<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NISSLAR — CMS Panel</title>
<link rel="icon" type="image/png" href="/assets/favicon.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .tab-active { border-bottom: 2px solid #3B82F6; color: #1E293B; }
  .tab-inactive { color: #94A3B8; }
  .modal-overlay { background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); }
  input, textarea, select { background: #FFFFFF; border: 1px solid #E2E8F0; color: #1E293B; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  .toast { animation: slideIn .3s ease; }
  @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body class="bg-white text-[#1E293B] min-h-screen">

<!-- Login Screen -->
<div id="login-screen" class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm p-8">
    <div class="text-center mb-8">
      <img src="/assets/favicon.png" alt="" class="h-12 w-12 rounded-md mx-auto mb-4"/>
      <h1 class="text-2xl font-semibold tracking-tight">NISSLAR CMS</h1>
      <p class="text-sm text-[#94A3B8] mt-2">Yönetim paneline giriş yapın</p>
    </div>
    <form id="login-form" class="space-y-4">
      <input type="password" id="login-password" placeholder="Şifre" class="w-full px-4 py-3 rounded-lg text-sm" autocomplete="current-password"/>
      <button type="submit" class="w-full bg-[#3B82F6] text-white py-3 rounded-lg font-semibold text-sm hover:bg-[#2563EB] transition">Giriş</button>
      <p id="login-error" class="text-red-400 text-xs text-center hidden">Geçersiz şifre</p>
    </form>
  </div>
</div>

<!-- CMS Panel -->
<div id="cms-panel" class="hidden">
  <!-- Top bar -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-[#E2E8F0] shadow-sm">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="/assets/favicon.png" alt="" class="h-8 w-8 rounded-md"/>
        <span class="font-semibold tracking-tight">NISSLAR CMS</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="/" target="_blank" class="text-xs text-[#94A3B8] hover:text-[#3B82F6] transition">Siteyi Gör ↗</a>
        <button id="logout-btn" class="text-xs text-[#94A3B8] hover:text-red-400 transition">Çıkış</button>
      </div>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="border-b border-[#E2E8F0]">
    <div class="max-w-6xl mx-auto px-6 flex gap-8">
      <button class="tab py-4 text-sm font-medium tab-active" data-tab="cars">Araçlar</button>
      <button class="tab py-4 text-sm font-medium tab-inactive" data-tab="content">İçerik</button>
      <button class="tab py-4 text-sm font-medium tab-inactive" data-tab="faq">SSS</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <!-- CARS TAB -->
    <div id="tab-cars" class="tab-content">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold">Araç Yönetimi</h2>
        <button id="add-car-btn" class="bg-[#3B82F6] text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-[#2563EB] transition">+ Yeni Araç</button>
      </div>
      <div id="cars-list" class="space-y-3"></div>
    </div>

    <!-- CONTENT TAB -->
    <div id="tab-content" class="tab-content hidden">
      <h2 class="text-lg font-semibold mb-6">Site İçerik Düzenleme</h2>
      <div id="content-editor" class="space-y-6"></div>
      <button id="save-content-btn" class="mt-8 bg-[#3B82F6] text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-[#2563EB] transition">Kaydet</button>
    </div>

    <!-- FAQ TAB -->
    <div id="tab-faq" class="tab-content hidden">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold">SSS Yönetimi</h2>
        <button id="add-faq-btn" class="bg-[#3B82F6] text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-[#2563EB] transition">+ Yeni Soru</button>
      </div>
      <div id="faq-list" class="space-y-3"></div>
    </div>
  </main>
</div>

<!-- Car Modal -->

          </div>
          <div>
            <label class="text-xs text-[#94A3B8] mb-1 block">Yıl</label>
            <input type="number" id="car-year" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>
            <label class="text-xs text-[#94A3B8] mb-1 block">Koltuk</label>
            <input type="number" id="car-seats" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>
            <label class="text-xs text-[#94A3B8] mb-1 block">BG (HP)</label>
            <input type="number" id="car-hp" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>
            <label class="text-xs text-[#94A3B8] mb-1 block">Kategori (TR)</label>
            <input type="text" id="car-cat-tr" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>
            <label class="text-xs text-[#94A3B8] mb-1 block">Kategori (EN)</label>
            <input type="text" id="car-cat-en" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>
            <label class="text-xs text-[#94A3B8] mb-1 block">Vites (TR)</label>
            <input type="text" id="car-gear-tr" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>
            <label class="text-xs text-[#94A3B8] mb-1 block">Vites (EN)</label>
            <input type="text" id="car-gear-en" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>
            <label class="text-xs text-[#94A3B8] mb-1 block">Yakıt</label>
            <input type="text" id="car-gas" class="w-full px-3 py-2 rounded-lg text-sm" placeholder="Premium"/>
          </div>
          <div>
            <label class="text-xs text-[#94A3B8] mb-1 block">MPG</label>

            <label class="text-xs text-[#94A3B8] mb-2 block">Görseller</label>

<!-- FAQ Modal -->

<!-- Toast -->
<div id="toast" class="fixed top-4 right-4 z-[60] hidden">
  <div class="toast bg-[#F8FAFC] border border-[#E2E8F0] px-4 py-3 rounded-lg text-sm shadow-xl">
    <span id="toast-msg"></span>
  </div>

<script>
const API = '/api';
let token = localStorage.getItem('cms_token') || '';
let carsData = [];
let faqData = [];
let contentData = {};
let devMode = false;

const DEV_PASSWORD = 'nisslar2026';

function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), duration);
}

async function api(path, method = 'GET', body = null) {
  if (devMode) return devApi(path, method, body);
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`${API}${path}`, opts);
  if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
  return res.json();
}

function devApi(path, method, body) {
  const key = `cms_dev${path.replace('/', '_')}`;
  if (method === 'PUT') {
    localStorage.setItem(key, JSON.stringify(body));
    return Promise.resolve(body);
  }
  const stored = localStorage.getItem(key);
  if (stored) return Promise.resolve(JSON.parse(stored));
  return fetch(`/_data${path}.json`).then(r => r.ok ? r.json() : (path === '/siteContent' ? {} : [])).catch(() => path === '/siteContent' ? {} : []);
}

async function checkDevMode() {
  try {
    const res = await fetch(`${API}/auth`, { method: 'OPTIONS' });
    return !res.ok;
  } catch { return true; }
}

// Auth
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('login-password').value;

  const isDev = await checkDevMode();
  if (isDev) {
    if (pw === DEV_PASSWORD) {
      devMode = true;
      token = 'dev-mode';
      localStorage.setItem('cms_token', token);
      localStorage.setItem('cms_dev_mode', 'true');
      showCMS();
    } else {
      document.getElementById('login-error').classList.remove('hidden');
    }
    return;
  }

  try {
    const res = await fetch(`${API}/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if (data.token) {
      token = data.token;
      localStorage.setItem('cms_token', token);
      showCMS();
    } else {
      document.getElementById('login-error').classList.remove('hidden');
    }
  } catch {
    document.getElementById('login-error').classList.remove('hidden');
  }
});

function logout() {
  token = '';
  devMode = false;
  localStorage.removeItem('cms_token');
  localStorage.removeItem('cms_dev_mode');
  document.getElementById('cms-panel').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}
document.getElementById('logout-btn').addEventListener('click', logout);

async function showCMS() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('cms-panel').classList.remove('hidden');
  await loadAll();
}

const DEFAULT_CONTENT = {

function deepMerge(defaults, data) {
  const result = JSON.parse(JSON.stringify(defaults));
  for (const key in data) {
    if (data[key] === null || data[key] === undefined) continue;
    if (Array.isArray(data[key]) && Array.isArray(result[key])) {
      result[key] = data[key].map((item, i) => {
        if (typeof item === 'object' && result[key][i]) return deepMerge(result[key][i], item);
        return item;
      });
    } else if (typeof data[key] === 'object' && typeof result[key] === 'object') {
      result[key] = deepMerge(result[key], data[key]);
    } else if (data[key] !== '') {
      result[key] = data[key];
    }
  }
  return result;
}

async function loadAll() {
  try {
    carsData = await api('/cars');
    faqData = await api('/faq');
    const raw = await api(devMode ? '/siteContent' : '/content');
    contentData = deepMerge(DEFAULT_CONTENT, raw);
    renderCars();
    renderFaqList();
    renderContentEditor();
  } catch (err) {
    console.error(err);
  }
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => { t.classList.remove('tab-active'); t.classList.add('tab-inactive'); });
    tab.classList.add('tab-active'); tab.classList.remove('tab-inactive');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    document.getElementById(`tab-${tab.dataset.tab}`).classList.remove('hidden');
  });
});

// Cars
function renderCars() {
  const list = document.getElementById('cars-list');
  list.innerHTML = carsData.map((c, i) => `
    <div class="flex items-center justify-between p-4 bg-[#F8FAFC] border border-[#E2E8F0] rounded-lg">
      <div class="flex items-center gap-4">
        <span class="text-xs text-[#94A3B8] font-mono">N°${String(i+1).padStart(3,'0')}</span>
        <div>
          <div class="font-medium text-sm">${c.name} <span class="text-[#94A3B8]">(${c.year})</span></div>
          <div class="text-xs text-[#94A3B8]">${c.brand || ''} · ${c.cat.tr} · ${c.hp} BG</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="editCar(${i})" class="text-xs text-[#F97316] hover:text-[#EA580C] transition px-3 py-1.5 border border-[#E2E8F0] rounded-lg">Düzenle</button>
        <button onclick="deleteCar(${i})" class="text-xs text-red-400 hover:text-red-300 transition px-3 py-1.5 border border-[#E2E8F0] rounded-lg">Sil</button>
      </div>
    </div>
  `).join('');
}

function openCarModal(car = null, index = -1) {
  document.getElementById('car-modal-title').textContent = car ? 'Araç Düzenle' : 'Yeni Araç';
  document.getElementById('car-id').value = index;
  document.getElementById('car-name').value = car?.name || '';
  document.getElementById('car-brand').value = car?.brand || '';
  document.getElementById('car-year').value = car?.year || new Date().getFullYear();
  document.getElementById('car-seats').value = car?.seats || '';
  document.getElementById('car-hp').value = car?.hp || '';
  document.getElementById('car-cat-tr').value = car?.cat?.tr || '';
  document.getElementById('car-cat-en').value = car?.cat?.en || '';
  document.getElementById('car-gear-tr').value = car?.gear?.tr || '';
  document.getElementById('car-gear-en').value = car?.gear?.en || '';
  document.getElementById('car-gas').value = car?.gas || '';
  document.getElementById('car-mpg').value = car?.mpg || '';
  document.getElementById('car-features').value = (car?.features || []).join(', ');
  window._carGallery = [...(car?.gallery || [])];
  renderGalleryPreview();
  document.getElementById('car-turo').value = car?.turoUrl || '';
  document.getElementById('car-modal').classList.remove('hidden');
}

function closeCarModal() { document.getElementById('car-modal').classList.add('hidden'); }
window._carGallery = [];

function renderGalleryPreview() {
  const container = document.getElementById('car-gallery-preview');
  if (!window._carGallery || window._carGallery.length === 0) {
    container.innerHTML = '<span class="text-xs text-[#94A3B8]">Henüz görsel eklenmedi</span>';
    return;
  }
  container.innerHTML = window._carGallery.map((url, i) => `
    <div class="relative group">
      <img src="${url}" class="w-20 h-14 object-cover rounded-lg border border-[#E2E8F0]"/>
      <button type="button" onclick="removeGalleryImg(${i})" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition">×</button>
      <span class="absolute bottom-0.5 left-0.5 text-[9px] bg-black/50 text-white px-1 rounded">${i + 1}</span>
    </div>
  `).join('');
}

window.removeGalleryImg = function(i) {
  window._carGallery.splice(i, 1);
  renderGalleryPreview();
};

document.getElementById('car-gallery-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById('car-gallery-status');
  status.textContent = 'Yükleniyor...';
  status.className = 'text-xs text-[#94A3B8] mt-2';
  status.classList.remove('hidden');
  try {
    const res = await fetch(`${API}/upload`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'X-Filename': file.name, 'X-Content-Type': file.type },
      body: file
    });
    const data = await res.json();
    if (data.url) {
      window._carGallery.push(data.url);
      renderGalleryPreview();
      status.textContent = 'Görsel eklendi!';
      status.classList.add('text-green-500');
      setTimeout(() => status.classList.add('hidden'), 2000);
    } else {
      status.textContent = 'Hata: ' + (data.error || 'Yükleme başarısız');
      status.classList.add('text-red-500');
    }
  } catch { status.textContent = 'Hata: Yükleme başarısız'; status.classList.add('text-red-500'); }
  e.target.value = '';
});

window.uploadContentImg = async function(input, path) {
  const file = input.files[0];
  if (!file) return;
  try {
    const res = await fetch(`${API}/upload`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'X-Filename': file.name, 'X-Content-Type': file.type },
      body: file
    });
    const data = await res.json();
    if (data.url) {
      const el = document.querySelector(`[data-path="${path}"]`);
      if (el) el.value = data.url;
      showToast('Görsel yüklendi');
      const parts = path.split('.');
      let obj = contentData;
      for (let i = 0; i < parts.length - 1; i++) { if (!obj[parts[i]]) obj[parts[i]] = {}; obj = obj[parts[i]]; }
      obj[parts[parts.length - 1]] = data.url;
    }
  } catch { showToast('Yükleme başarısız'); }
  input.value = '';
};

    html += s.fields.map(f => {
      const val = contentData[s.key]?.[f.id];
      if (f.type === 'image') {
        return `<div>
          <label class="text-[11px] text-[#94A3B8] mb-1.5 block uppercase tracking-wider">${f.label}</label>
          <div class="flex items-center gap-3">
            <input type="text" data-path="${s.key}.${f.id}" value="${esc(val)}" placeholder="Görsel URL" class="flex-1 px-3 py-2.5 rounded-lg text-sm"/>
            <label class="cursor-pointer bg-[#E2E8F0] hover:bg-[#39342B] transition px-4 py-2.5 rounded-lg text-xs font-medium">
              Yükle
              <input type="file" accept="image/*" class="hidden" onchange="uploadContentImg(this, '${s.key}.${f.id}')"/>
            </label>
          </div>
          ${val ? `<img src="${val}" class="mt-2 h-20 rounded border border-[#E2E8F0] object-cover"/>` : ''}
        </div>`;
      }
      if (s.single) {
        return `<div>
          <label class="text-[11px] text-[#94A3B8] mb-1.5 block uppercase tracking-wider">${f.label}</label>
          ${f.type === 'textarea'
            ? `<textarea rows="2" data-path="${s.key}.${f.id}" placeholder="${f.label}" class="w-full px-3 py-2.5 rounded-lg text-sm">${esc(val)}</textarea>`
            : `<input type="text" data-path="${s.key}.${f.id}" value="${esc(val)}" placeholder="${f.label}" class="w-full px-3 py-2.5 rounded-lg text-sm"/>`}
        </div>`;
      }
      return `<div>
        <label class="text-[11px] text-[#94A3B8] mb-1.5 block uppercase tracking-wider">${f.label}</label>
        <div class="grid grid-cols-2 gap-3">
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-[10px] text-[#F97316] font-medium pointer-events-none">TR</span>
            ${f.type === 'textarea'
              ? `<textarea rows="2" data-path="${s.key}.${f.id}.tr" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm">${esc(val?.tr)}</textarea>`
              : `<input type="text" data-path="${s.key}.${f.id}.tr" value="${esc(val?.tr)}" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm"/>`}
          </div>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-[10px] text-[#F97316] font-medium pointer-events-none">EN</span>
            ${f.type === 'textarea'

            </div>`;
          }).join('')}
        </div>
      </div>`;
    }

    html += `</div></div>`;
    return html;
  }).join('');
}

document.getElementById('save-content-btn').addEventListener('click', async () => {
  document.querySelectorAll('[data-path]').forEach(el => {
    const parts = el.dataset.path.split('.');
    let obj = contentData;
    for (let i = 0; i < parts.length - 1; i++) {
      const key = parts[i];
      const nextKey = parts[i + 1];
      if (!isNaN(nextKey)) {
        if (!Array.isArray(obj[key])) obj[key] = [];
        while (obj[key].length <= parseInt(nextKey)) obj[key].push({});
        obj = obj[key];
        continue;
      }
      if (!obj[key]) obj[key] = {};
      obj = obj[key];
    }
    obj[parts[parts.length - 1]] = el.value;
  });
  const socialInputs = document.querySelectorAll('[data-social]');
  if (socialInputs.length) {
    if (!contentData.site) contentData.site = {};
    contentData.site.socials = Array.from(socialInputs).map(el => ({
      platform: el.dataset.social,
      url: el.value.trim()
    }));
  }
  await api(devMode ? '/siteContent' : '/content', 'PUT', contentData);
  showToast('İçerik kaydedildi');
});
