<style>

<body class="bg-white text-[#1E293B] min-h-screen">

<!-- Login Screen -->

<script>
const API = '/api';
let token = localStorage.getItem('cms_token') || '';
let carsData = [];
let faqData = [];

let devMode = false;

const DEV_PASSWORD = 'nisslar2026';

function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), duration);
}

async function api(path, method = 'GET', body = null) {
  if (devMode) return devApi(path, method, body);
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`${API}${path}`, opts);
  if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
  return res.json();
}

function devApi(path, method, body) {
  const key = `cms_dev${path.replace('/', '_')}`;
  if (method === 'PUT') {
    localStorage.setItem(key, JSON.stringify(body));
    return Promise.resolve(body);
  }
  const stored = localStorage.getItem(key);
  if (stored) return Promise.resolve(JSON.parse(stored));
  return fetch(`/_data${path}.json`).then(r => r.ok ? r.json() : (path === '/siteContent' ? {} : [])).catch(() => path === '/siteContent' ? {} : []);
}

async function checkDevMode() {
  try {
    const res = await fetch(`${API}/auth`, { method: 'OPTIONS' });
    return !res.ok;
  } catch { return true; }
}

// Auth
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('login-password').value;

  const isDev = await checkDevMode();
  if (isDev) {
    if (pw === DEV_PASSWORD) {
      devMode = true;
      token = 'dev-mode';
      localStorage.setItem('cms_token', token);
      localStorage.setItem('cms_dev_mode', 'true');
      showCMS();
    } else {
      document.getElementById('login-error').classList.remove('hidden');
    }
    return;
  }

  try {
    const res = await fetch(`${API}/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if (data.token) {
      token = data.token;
      localStorage.setItem('cms_token', token);
      showCMS();
    } else {
      document.getElementById('login-error').classList.remove('hidden');
    }
  } catch {
    document.getElementById('login-error').classList.remove('hidden');
  }
});

function logout() {
  token = '';
  devMode = false;
  localStorage.removeItem('cms_token');
  localStorage.removeItem('cms_dev_mode');
  document.getElementById('cms-panel').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}
document.getElementById('logout-btn').addEventListener('click', logout);

async function showCMS() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('cms-panel').classList.remove('hidden');
  await loadAll();
}

function deepMerge(defaults, data) {
  const result = JSON.parse(JSON.stringify(defaults));
  for (const key in data) {
    if (data[key] === null || data[key] === undefined) continue;
    if (Array.isArray(data[key]) && Array.isArray(result[key])) {
      result[key] = data[key].map((item, i) => {
        if (typeof item === 'object' && result[key][i]) return deepMerge(result[key][i], item);
        return item;
      });
    } else if (typeof data[key] === 'object' && typeof result[key] === 'object') {
      result[key] = deepMerge(result[key], data[key]);
    } else if (data[key] !== '') {
      result[key] = data[key];
    }
  }
  return result;
}

async function loadAll() {
  try {
    carsData = (await api('/cars')).filter(c => !c.deleted);
    faqData = await api('/faq');
    const raw = await api(devMode ? '/siteContent' : '/content');
    contentData = deepMerge(DEFAULT_CONTENT, raw);
    renderCars();
    renderFaqList();
    renderContentEditor();
  } catch (err) {
    console.error(err);
  }
}

function openCarModal(car = null, index = -1) {
  document.getElementById('car-modal-title').textContent = car ? 'Araç Düzenle' : 'Yeni Araç';
  document.getElementById('car-id').value = index;
  document.getElementById('car-name').value = car?.name || '';
  document.getElementById('car-brand').value = car?.brand || '';
  document.getElementById('car-year').value = car?.year || new Date().getFullYear();
  document.getElementById('car-seats').value = car?.seats || '';
  document.getElementById('car-hp').value = car?.hp || '';
  document.getElementById('car-cat-tr').value = car?.cat?.tr || '';
  document.getElementById('car-cat-en').value = car?.cat?.en || '';
  
  // Set gear select value
  const gearObj = car?.gear || { tr: "Otomatik", en: "Auto" };
  const gearKey = Object.keys(GEAR_MAP).find(k => GEAR_MAP[k].tr === gearObj.tr) || "otomatik";
  document.getElementById('car-gear').value = gearKey;

  // Set gas select value
  const gasObj = car?.gas || "Premium";
  let gasKey = "benzin";
  if (typeof gasObj === 'object') {
    gasKey = Object.keys(GAS_MAP).find(k => GAS_MAP[k].tr === gasObj.tr) || "benzin";
  } else {
    const lowerGas = String(gasObj).toLowerCase();
    if (lowerGas.includes('electric') || lowerGas.includes('elektrik')) gasKey = "elektrik";
    else if (lowerGas.includes('diesel') || lowerGas.includes('dizel')) gasKey = "dizel";
    else if (lowerGas.includes('hybrid') || lowerGas.includes('hibrit')) gasKey = "hibrit";
    else gasKey = "benzin"; // default for Premium, Benzin etc.
  }
  document.getElementById('car-gas').value = gasKey;

  // Set features checklist and custom features input
  const carFeatures = car?.features || [];
  const standardChecked = carFeatures.filter(f => STANDARD_FEATURES.includes(f));
  const customFeatures = carFeatures.filter(f => !STANDARD_FEATURES.includes(f));
  
  if (car) {
    renderFeaturesChecklist(standardChecked);
    document.getElementById('car-features-custom').value = customFeatures.join(', ');
  } else {
    renderFeaturesChecklist(DEFAULT_FEATURES);
    document.getElementById('car-features-custom').value = '';
  }

  window._carGallery = [...(car?.gallery || [])];
  renderGalleryPreview();
  document.getElementById('car-turo').value = car?.turoUrl || '';
  document.getElementById('car-modal').classList.remove('hidden');
}

function renderGalleryPreview() {
  const container = document.getElementById('car-gallery-preview');
  if (!window._carGallery || window._carGallery.length === 0) {
    container.innerHTML = '<span class="text-xs text-[#94A3B8]">Henüz görsel eklenmedi</span>';
    return;
  }
  container.innerHTML = window._carGallery.map((url, i) => `
    <div class="relative group cursor-grab active:cursor-grabbing border-2 border-transparent hover:border-[#3B82F6] rounded-lg transition" draggable="true" data-index="${i}">

      <button type="button" onclick="removeGalleryImg(${i})" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition z-10">×</button>

    </div>
  `).join('');

  initGalleryDragAndDrop();

function initGalleryDragAndDrop() {
  const container = document.getElementById('car-gallery-preview');
  const items = container.querySelectorAll('[draggable="true"]');
  
  items.forEach(item => {
    item.addEventListener('dragstart', (e) => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', item.getAttribute('data-index'));
      item.classList.add('opacity-40', 'scale-95');
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      item.classList.add('border-[#3B82F6]');
    });

    item.addEventListener('dragleave', () => {
      item.classList.remove('border-[#3B82F6]');
    });

    item.addEventListener('drop', (e) => {
      e.preventDefault();
      item.classList.remove('border-[#3B82F6]');
      const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
      const toIndex = parseInt(item.getAttribute('data-index'));
      if (!isNaN(fromIndex) && fromIndex !== toIndex) {
        const movedItem = window._carGallery.splice(fromIndex, 1)[0];
        window._carGallery.splice(toIndex, 0, movedItem);
        renderGalleryPreview();
      }
    });

    item.addEventListener('dragend', () => {
      item.classList.remove('opacity-40', 'scale-95', 'border-[#3B82F6]');
    });
  });
}

window.removeGalleryImg = function(i) {
  window._carGallery.splice(i, 1);
  renderGalleryPreview();
};

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = error => reject(error);
  });
}

async function handleMultipleUploads(files) {
  const status = document.getElementById('car-gallery-status');
  if (!status) return;
  status.className = 'text-xs text-[#94A3B8] mt-1';
  status.classList.remove('hidden');
  
  let successCount = 0;
  let failCount = 0;
  const total = files.length;
  
  for (let i = 0; i < total; i++) {
    const file = files[i];
    status.textContent = `Görsel yükleniyor (${i + 1}/${total}): ${file.name}`;
    try {
      const base64Data = await fileToBase64(file);
      const res = await fetch(`${API}/upload`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          filename: file.name,
          contentType: file.type,
          base64Data: base64Data
        })
      });
      if (res.status === 401) {
        logout();
        showToast('Oturum süresi doldu, lütfen tekrar giriş yapın');
        return;
      }
      const data = await res.json();
      if (data.url) {
        window._carGallery.push(data.url);
        renderGalleryPreview();
        successCount++;
      } else {
        failCount++;
      }
    } catch (err) {
      console.error(err);
      failCount++;
    }
  }
  
  if (failCount === 0) {
    status.textContent = `${successCount} görsel başarıyla yüklendi!`;
    status.className = 'text-xs text-green-500 mt-1';
  } else {
    status.textContent = `${successCount} görsel yüklendi, ${failCount} görsel yüklenemedi.`;
    status.className = 'text-xs text-[#F97316] mt-1';
  }
  setTimeout(() => status.classList.add('hidden'), 4000);
}

function initImageDropzone() {
  const dropzone = document.getElementById('car-image-dropzone');
  const fileInput = document.getElementById('car-gallery-file');
  if (!dropzone || !fileInput) return;

  // Prevent default events
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropzone.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, false);
  });

  // Highlight/unhighlight dropzone
  ['dragenter', 'dragover'].forEach(eventName => {
    dropzone.addEventListener(eventName, () => {
      dropzone.classList.add('border-[#3B82F6]', 'bg-blue-50/20');
    }, false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    dropzone.addEventListener(eventName, () => {
      dropzone.classList.remove('border-[#3B82F6]', 'bg-blue-50/20');
    }, false);
  });

  // Handle drop
  dropzone.addEventListener('drop', async (e) => {
    const dt = e.dataTransfer;
    const files = dt.files;
    if (files && files.length > 0) {
      await handleMultipleUploads(files);
    }
  });

  // Handle click to select files
  dropzone.addEventListener('click', () => fileInput.click());

  // Handle input change
  fileInput.addEventListener('change', async (e) => {
    const files = e.target.files;
    if (files && files.length > 0) {
      await handleMultipleUploads(files);
    }
    e.target.value = '';
  });
}

window.uploadContentImg = async function(input, path) {
  const file = input.files[0];
  if (!file) return;
  try {
    const base64Data = await fileToBase64(file);
    const res = await fetch(`${API}/upload`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        filename: file.name,
        contentType: file.type,
        base64Data: base64Data
      })
    });
    if (res.status === 401) {
      logout();
      showToast('Oturum süresi doldu, lütfen tekrar giriş yapın');
      return;
    }
    const data = await res.json();
    if (data.url) {
      const el = document.querySelector(`[data-path="${path}"]`);
      if (el) el.value = data.url;
      showToast('Görsel yüklendi');
      const parts = path.split('.');
      let obj = contentData;
      for (let i = 0; i < parts.length - 1; i++) { if (!obj[parts[i]]) obj[parts[i]] = {}; obj = obj[parts[i]]; }
      obj[parts[parts.length - 1]] = data.url;
    } else {
      showToast('Yükleme başarısız: ' + (data.error || ''));
    }
  } catch (err) {
    console.error(err);
    showToast('Yükleme başarısız');
  }
  input.value = '';
};

  const chks = document.querySelectorAll('input[name="select-car-chk"]');

  const count = checkedChks.length;
  
  const btnTop = document.getElementById('delete-selected-top');
  const btnBottom = document.getElementById('delete-selected-bottom');
  const masterChk = document.getElementById('select-all-cars');
  const selectedCountText = document.getElementById('selected-count-text');
  const listHeader = document.getElementById('cars-list-header');
  
  if (chks.length > 0) {
    if (listHeader) listHeader.classList.remove('hidden');
  } else {
    if (listHeader) listHeader.classList.add('hidden');
  }

  if (masterChk) {
    masterChk.checked = (chks.length > 0 && count === chks.length);
  }

  if (selectedCountText) {
    selectedCountText.textContent = `${count} araç seçildi`;
  }

  if (count > 0) {
    if (btnTop) btnTop.classList.remove('hidden');
    if (btnBottom) btnBottom.classList.remove('hidden');
  } else {
    if (btnTop) btnTop.classList.add('hidden');

  }
};

            <input type="text" data-path="${s.key}.${f.id}" value="${esc(val)}" placeholder="Görsel URL" class="flex-1 px-3 py-2.5 rounded-lg text-sm"/>
            <label class="cursor-pointer bg-[#E2E8F0] hover:bg-[#39342B] transition px-4 py-2.5 rounded-lg text-xs font-medium">
              Yükle
              <input type="file" accept="image/*" class="hidden" onchange="uploadContentImg(this, '${s.key}.${f.id}')"/>
            </label>
          </div>
          ${val ? `<img src="${val}" class="mt-2 h-20 rounded border border-[#E2E8F0] object-cover"/>` : ''}
        </div>`;
      }
      if (s.single) {
        return `<div>
          <label class="text-[11px] text-[#94A3B8] mb-1.5 block uppercase tracking-wider">${f.label}</label>
          ${f.type === 'textarea'
            ? `<textarea rows="2" data-path="${s.key}.${f.id}" placeholder="${f.label}" class="w-full px-3 py-2.5 rounded-lg text-sm">${esc(val)}</textarea>`
            : `<input type="text" data-path="${s.key}.${f.id}" value="${esc(val)}" placeholder="${f.label}" class="w-full px-3 py-2.5 rounded-lg text-sm"/>`}
        </div>`;
      }
      return `<div>
        <label class="text-[11px] text-[#94A3B8] mb-1.5 block uppercase tracking-wider">${f.label}</label>
        <div class="grid grid-cols-2 gap-3">
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-[10px] text-[#F97316] font-medium pointer-events-none">TR</span>
            ${f.type === 'textarea'
              ? `<textarea rows="2" data-path="${s.key}.${f.id}.tr" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm">${esc(val?.tr)}</textarea>`
              : `<input type="text" data-path="${s.key}.${f.id}.tr" value="${esc(val?.tr)}" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm"/>`}
          </div>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-[10px] text-[#F97316] font-medium pointer-events-none">EN</span>
            ${f.type === 'textarea'
              ? `<textarea rows="2" data-path="${s.key}.${f.id}.en" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm">${esc(val?.en)}</textarea>`
              : `<input type="text" data-path="${s.key}.${f.id}.en" value="${esc(val?.en)}" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm"/>`}
          </div>
        </div>
      </div>`;
    }).join('');

    if (s.items) {
      const items = contentData[s.key]?.items || [];
      html += items.map((item, idx) => `
        <div class="mt-2 pl-4 border-l-2 border-[#E2E8F0]">
          <div class="text-[11px] text-[#94A3B8] mb-2 uppercase tracking-wider">${s.items.label} ${idx + 1}</div>
          ${s.items.fields.map(f => {
            const v = item[f.id];
            return `<div class="mb-3">
              <label class="text-[11px] text-[#94A3B8] mb-1 block">${f.label}</label>
              <div class="grid grid-cols-2 gap-3">
                <div class="relative">
                  <span class="absolute left-3 top-2.5 text-[10px] text-[#F97316] font-medium pointer-events-none">TR</span>
                  ${f.type === 'textarea'
                    ? `<textarea rows="2" data-path="${s.key}.items.${idx}.${f.id}.tr" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm">${esc(v?.tr)}</textarea>`
                    : `<input type="text" data-path="${s.key}.items.${idx}.${f.id}.tr" value="${esc(v?.tr)}" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm"/>`}
                </div>
                <div class="relative">
                  <span class="absolute left-3 top-2.5 text-[10px] text-[#F97316] font-medium pointer-events-none">EN</span>
                  ${f.type === 'textarea'
                    ? `<textarea rows="2" data-path="${s.key}.items.${idx}.${f.id}.en" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm">${esc(v?.en)}</textarea>`
                    : `<input type="text" data-path="${s.key}.items.${idx}.${f.id}.en" value="${esc(v?.en)}" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm"/>`}
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>
      `).join('');
    }

    if (s.socials) {
      const platforms = { instagram: 'Instagram', facebook: 'Facebook', tiktok: 'TikTok', linkedin: 'LinkedIn', x: 'X (Twitter)' };
      const socials = contentData[s.key]?.socials || [];
      html += `<div class="mt-4 pt-4 border-t border-[#E2E8F0]">
        <div class="text-[11px] text-[#94A3B8] mb-3 uppercase tracking-wider">Sosyal Medya</div>
        <div class="space-y-3">
          ${Object.entries(platforms).map(([key, label]) => {
            const existing = socials.find(sc => sc.platform === key);
            const url = existing?.url || '';
            return `<div class="flex items-center gap-3">
              <span class="text-xs text-[#94A3B8] w-20 shrink-0">${label}</span>
              <input type="text" data-social="${key}" value="${esc(url)}" placeholder="https://..." class="flex-1 px-3 py-2 rounded-lg text-sm"/>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }

    html += `</div></div>`;
    return html;
  }).join('');
}

document.getElementById('save-content-btn').addEventListener('click', async () => {
  document.querySelectorAll('[data-path]').forEach(el => {
    const parts = el.dataset.path.split('.');
    let obj = contentData;
    for (let i = 0; i < parts.length - 1; i++) {
      const key = parts[i];
      const nextKey = parts[i + 1];
      if (!isNaN(nextKey)) {
        if (!Array.isArray(obj[key])) obj[key] = [];
        while (obj[key].length <= parseInt(nextKey)) obj[key].push({});
        obj = obj[key];
        continue;
      }
      if (!obj[key]) obj[key] = {};
      obj = obj[key];
    }
    obj[parts[parts.length - 1]] = el.value;
  });
  const socialInputs = document.querySelectorAll('[data-social]');
  if (socialInputs.length) {
    if (!contentData.site) contentData.site = {};
    contentData.site.socials = Array.from(socialInputs).map(el => ({
      platform: el.dataset.social,
      url: el.value.trim()
    }));
  }
  await api(devMode ? '/siteContent' : '/content', 'PUT', contentData);
  showToast('İçerik kaydedildi');
});

function isTokenExpired(t) {
  if (!t) return true;
  if (t === 'dev-mode') return false;
  const parts = t.split('.');
  if (parts.length < 2) return true;
  const expiry = parseInt(parts[parts.length - 1]);
  return isNaN(expiry) || Date.now() >= expiry;
}

// Init
(async () => {
  if (token && !isTokenExpired(token)) {
    if (localStorage.getItem('cms_dev_mode') === 'true') {
      devMode = true;
    }
    try {
      await loadAll();
      showCMS();
    } catch { logout(); }
  } else {
    logout();
  }
})();
</script>
