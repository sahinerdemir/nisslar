<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>nisslar — CMS Panel</title>
<link rel="icon" type="image/png" href="/assets/favicon.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .tab-active { border-bottom: 2px solid #C2A05A; color: #F4EFE4; }
  .tab-inactive { color: #8B847A; }
  .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
  input, textarea, select { background: #1C1813; border: 1px solid #2A2620; color: #F4EFE4; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #C2A05A; }
  .toast { animation: slideIn .3s ease; }
  @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body class="bg-[#16130F] text-[#F4EFE4] min-h-screen">

<!-- Login Screen -->
<div id="login-screen" class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm p-8">
    <div class="text-center mb-8">
      <img src="/assets/favicon.png" alt="" class="h-12 w-12 rounded-md mx-auto mb-4"/>
      <h1 class="text-2xl font-semibold tracking-tight">nisslar CMS</h1>
      <p class="text-sm text-[#8B847A] mt-2">Yönetim paneline giriş yapın</p>
    </div>
    <form id="login-form" class="space-y-4">
      <input type="password" id="login-password" placeholder="Şifre" class="w-full px-4 py-3 rounded-lg text-sm" autocomplete="current-password"/>
      <button type="submit" class="w-full bg-[#C2A05A] text-[#16130F] py-3 rounded-lg font-semibold text-sm hover:bg-[#D4B776] transition">Giriş</button>
      <p id="login-error" class="text-red-400 text-xs text-center hidden">Geçersiz şifre</p>
    </form>
  </div>
</div>

<!-- CMS Panel -->
<div id="cms-panel" class="hidden">
  <!-- Top bar -->
  <header class="sticky top-0 z-40 bg-[#16130F]/90 backdrop-blur border-b border-[#2A2620]">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="/assets/favicon.png" alt="" class="h-8 w-8 rounded-md"/>
        <span class="font-semibold tracking-tight">nisslar CMS</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="/" target="_blank" class="text-xs text-[#8B847A] hover:text-[#F4EFE4] transition">Siteyi Gör ↗</a>
        <button id="logout-btn" class="text-xs text-[#8B847A] hover:text-red-400 transition">Çıkış</button>
      </div>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="border-b border-[#2A2620]">
    <div class="max-w-6xl mx-auto px-6 flex gap-8">
      <button class="tab py-4 text-sm font-medium tab-active" data-tab="cars">Araçlar</button>
      <button class="tab py-4 text-sm font-medium tab-inactive" data-tab="content">İçerik</button>

    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <!-- CARS TAB -->
    <div id="tab-cars" class="tab-content">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold">Araç Yönetimi</h2>
        <button id="add-car-btn" class="bg-[#C2A05A] text-[#16130F] px-4 py-2 rounded-lg text-sm font-semibold hover:bg-[#D4B776] transition">+ Yeni Araç</button>
      </div>

    </div>

    <!-- CONTENT TAB -->
    <div id="tab-content" class="tab-content hidden">
      <h2 class="text-lg font-semibold mb-6">Site İçerik Düzenleme</h2>
      <div id="content-editor" class="space-y-6"></div>
      <button id="save-content-btn" class="mt-8 bg-[#C2A05A] text-[#16130F] px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-[#D4B776] transition">Kaydet</button>
    </div>

    <!-- FAQ TAB -->
    <div id="tab-faq" class="tab-content hidden">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold">SSS Yönetimi</h2>
        <button id="add-faq-btn" class="bg-[#C2A05A] text-[#16130F] px-4 py-2 rounded-lg text-sm font-semibold hover:bg-[#D4B776] transition">+ Yeni Soru</button>
      </div>
      <div id="faq-list" class="space-y-3"></div>
    </div>

</div>

<!-- Car Modal -->

          </div>
          <div>

            <input type="number" id="car-price" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>

            <input type="number" id="car-was" class="w-full px-3 py-2 rounded-lg text-sm"/>
          </div>
          <div>
            <label class="text-xs text-[#8B847A] mb-1 block">Puan</label>
            <input type="number" id="car-rating" step="0.01" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>
            <label class="text-xs text-[#8B847A] mb-1 block">Koltuk</label>
            <input type="number" id="car-seats" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>
            <label class="text-xs text-[#8B847A] mb-1 block">BG (HP)</label>
            <input type="number" id="car-hp" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>
            <label class="text-xs text-[#8B847A] mb-1 block">Kategori (TR)</label>

          </div>
          <div>
            <label class="text-xs text-[#8B847A] mb-1 block">Kategori (EN)</label>
            <input type="text" id="car-cat-en" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>
            <label class="text-xs text-[#8B847A] mb-1 block">Vites (TR)</label>
            <input type="text" id="car-gear-tr" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>
          <div>
            <label class="text-xs text-[#8B847A] mb-1 block">Vites (EN)</label>
            <input type="text" id="car-gear-en" class="w-full px-3 py-2 rounded-lg text-sm" required/>
          </div>

            <label class="text-xs text-[#8B847A] mb-1 block">Görsel URL (opsiyonel)</label>
            <div class="flex gap-2">
              <input type="text" id="car-img" class="flex-1 px-3 py-2 rounded-lg text-sm"/>
              <label class="shrink-0 cursor-pointer bg-[#2A2620] hover:bg-[#3A3630] text-[#F4EFE4] px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                Yükle

<!-- FAQ Modal -->

      <div class="flex items-center justify-between mb-6">
        <h3 id="faq-modal-title" class="text-lg font-semibold">Yeni Soru</h3>

        <input type="hidden" id="faq-id"/>
        <div>
          <label class="text-xs text-[#8B847A] mb-1 block">Soru (TR)</label>

        </div>
        <div>
          <label class="text-xs text-[#8B847A] mb-1 block">Soru (EN)</label>
          <input type="text" id="faq-q-en" class="w-full px-3 py-2 rounded-lg text-sm" required/>

        <div>

          <textarea id="faq-a-tr" rows="3" class="w-full px-3 py-2 rounded-lg text-sm" required></textarea>

        <div>

        </div>
        <div class="flex justify-end gap-3 pt-4">
          <button type="button" id="faq-cancel" class="px-4 py-2 text-sm text-[#8B847A] hover:text-[#F4EFE4] transition">İptal</button>

<!-- Toast -->
<div id="toast" class="fixed top-4 right-4 z-[60] hidden">
  <div class="toast bg-[#1C1813] border border-[#2A2620] px-4 py-3 rounded-lg text-sm shadow-xl">
    <span id="toast-msg"></span>
  </div>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('cms_token') || '';
let carsData = [];
let faqData = [];
let contentData = {};
let devMode = false;

const DEV_PASSWORD = 'nisslar2026';

function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), duration);
}

async function api(path, method = 'GET', body = null) {
  if (devMode) return devApi(path, method, body);
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`${API}${path}`, opts);
  if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
  return res.json();
}

function devApi(path, method, body) {
  const key = `cms_dev${path.replace('/', '_')}`;
  if (method === 'PUT') {
    localStorage.setItem(key, JSON.stringify(body));
    return Promise.resolve(body);
  }
  const stored = localStorage.getItem(key);
  if (stored) return Promise.resolve(JSON.parse(stored));
  return fetch(`/_data${path}.json`).then(r => r.ok ? r.json() : (path === '/siteContent' ? {} : [])).catch(() => path === '/siteContent' ? {} : []);
}

async function checkDevMode() {
  try {
    const res = await fetch(`${API}/auth`, { method: 'OPTIONS' });
    return !res.ok;
  } catch { return true; }
}

// Auth
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('login-password').value;

  const isDev = await checkDevMode();
  if (isDev) {
    if (pw === DEV_PASSWORD) {
      devMode = true;
      token = 'dev-mode';
      localStorage.setItem('cms_token', token);
      localStorage.setItem('cms_dev_mode', 'true');
      showCMS();
    } else {
      document.getElementById('login-error').classList.remove('hidden');
    }
    return;
  }

  try {
    const res = await fetch(`${API}/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if (data.token) {
      token = data.token;
      localStorage.setItem('cms_token', token);
      showCMS();
    } else {
      document.getElementById('login-error').classList.remove('hidden');
    }
  } catch {
    document.getElementById('login-error').classList.remove('hidden');
  }
});

function logout() {
  token = '';
  devMode = false;
  localStorage.removeItem('cms_token');
  localStorage.removeItem('cms_dev_mode');
  document.getElementById('cms-panel').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}
document.getElementById('logout-btn').addEventListener('click', logout);

async function showCMS() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('cms-panel').classList.remove('hidden');
  await loadAll();
}

const DEFAULT_CONTENT = {
  site: {
    email: 'hello@nisslar.com',
    phone: '+1 (305) 555 12 34',
    address: '1450 Brickell Ave\nMiami, FL 33131'
  },
  hero: {
    eyebrow: { tr: 'Miami · Lüks Filo', en: 'Miami · Luxury Fleet' },
    title1: { tr: 'Sürüş değil,', en: 'Not a drive,' },
    title2_prefix: { tr: 'bir ', en: 'an ' },
    title2_gold: { tr: 'deneyim', en: 'experience' },
    sub: { tr: 'Miami sokaklarında, özenle seçilmiş bir filo. Sigorta dahil, gizli ücret yok — yalnız siz, anahtarlar ve yol.', en: 'A carefully curated fleet on the streets of Miami. Insurance included, no hidden fees — just you, the keys, and the road.' }
  },
  trust: {
    lead: { tr: 'Üç söz veriyoruz, üçünü de tutuyoruz.', en: 'Three promises — all of them kept.' },
    items: [
      { title: { tr: 'Sigorta Dahil', en: 'Insurance Included' }, desc: { tr: 'Tam kapsamlı koruma, ilk dakikadan son dakikaya kadar. Ek ücret yok, soru yok.', en: 'Full coverage, from the first minute to the last. No surcharge, no questions.' } },
      { title: { tr: '7/24 Concierge', en: '24/7 Concierge' }, desc: { tr: 'Telefonun ucunda, her gece yarısı. Yol yardımı, plan değişikliği, sessiz destek.', en: 'A phone call away at midnight. Roadside, plan changes, quiet support.' } },
      { title: { tr: 'Gizli Ücret Yok', en: 'No Hidden Fees' }, desc: { tr: 'Sözleşmenin üst satırı, alt satıra eşittir. Şeffaf — başka türlüsünü düşünmüyoruz.', en: "The top line equals the bottom line. Transparent — we don't know another way." } }
    ]
  },
  about: {
    title1: { tr: "Miami'de,", en: 'Quiet luxury,' },
    title2_prefix: { tr: 'sessiz bir ', en: 'in the heart of ' },
    title2_gold: { tr: 'lüks', en: 'Miami' },
    quote: { tr: 'Filomuzu büyütmek değil, derinleştirmek istedik. Her araç tek tek seçildi — sayı değil, sürüş önemli.', en: 'We wanted to deepen the fleet, not enlarge it. Each car hand-picked — not numbers, but drives.' },
    p1: { tr: "2018'den bu yana Miami'de butik bir araç deneyimi sunuyoruz. Brickell'deki küçük garajımızdan başlayan iş; bugün özenle bakılan 42 araç ve elden yapılan binlerce teslimata dönüştü. Büyümek isteseydik çoktan büyürdük — biz iyi kalmayı seçtik.", en: "Since 2018 we've offered a boutique driving experience in Miami. From a small Brickell garage to a meticulously maintained 42-car fleet and thousands of in-person handovers. We could have scaled — we chose to stay good." }
  },
  footer: {
    about: { tr: "Miami merkezli, butik lüks araç kiralama. 2018'den beri özenle.", en: 'Miami-based, boutique luxury car rental. Carefully, since 2018.' }
  }
};

function deepMerge(defaults, data) {
  const result = JSON.parse(JSON.stringify(defaults));
  for (const key in data) {
    if (data[key] === null || data[key] === undefined) continue;
    if (Array.isArray(data[key]) && Array.isArray(result[key])) {
      result[key] = data[key].map((item, i) => {
        if (typeof item === 'object' && result[key][i]) return deepMerge(result[key][i], item);
        return item;
      });
    } else if (typeof data[key] === 'object' && typeof result[key] === 'object') {
      result[key] = deepMerge(result[key], data[key]);
    } else if (data[key] !== '') {
      result[key] = data[key];
    }
  }
  return result;
}

async function loadAll() {
  try {
    carsData = await api('/cars');
    faqData = await api('/faq');
    const raw = await api(devMode ? '/siteContent' : '/content');
    contentData = deepMerge(DEFAULT_CONTENT, raw);
    renderCars();
    renderFaqList();
    renderContentEditor();
  } catch (err) {
    console.error(err);
  }
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => { t.classList.remove('tab-active'); t.classList.add('tab-inactive'); });
    tab.classList.add('tab-active'); tab.classList.remove('tab-inactive');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    document.getElementById(`tab-${tab.dataset.tab}`).classList.remove('hidden');
  });
});

// Cars
function renderCars() {
  const list = document.getElementById('cars-list');
  list.innerHTML = carsData.map((c, i) => `
    <div class="flex items-center justify-between p-4 bg-[#1C1813] border border-[#2A2620] rounded-lg">
      <div class="flex items-center gap-4">
        <span class="text-xs text-[#8B847A] font-mono">N°${String(i+1).padStart(3,'0')}</span>
        <div>
          <div class="font-medium text-sm">${c.name} <span class="text-[#8B847A]">(${c.year})</span></div>
          <div class="text-xs text-[#8B847A]">${c.cat.tr} · $${c.price}/gün · ${c.hp} BG</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="editCar(${i})" class="text-xs text-[#C2A05A] hover:text-[#D4B776] transition px-3 py-1.5 border border-[#2A2620] rounded-lg">Düzenle</button>
        <button onclick="deleteCar(${i})" class="text-xs text-red-400 hover:text-red-300 transition px-3 py-1.5 border border-[#2A2620] rounded-lg">Sil</button>
      </div>
    </div>
  `).join('');
}

function openCarModal(car = null, index = -1) {
  document.getElementById('car-modal-title').textContent = car ? 'Araç Düzenle' : 'Yeni Araç';
  document.getElementById('car-id').value = index;
  document.getElementById('car-name').value = car?.name || '';
  document.getElementById('car-year').value = car?.year || new Date().getFullYear();
  document.getElementById('car-price').value = car?.price || '';
  document.getElementById('car-was').value = car?.was || '';
  document.getElementById('car-rating').value = car?.rating || 5.00;
  document.getElementById('car-seats').value = car?.seats || '';
  document.getElementById('car-hp').value = car?.hp || '';
  document.getElementById('car-cat-tr').value = car?.cat?.tr || '';
  document.getElementById('car-cat-en').value = car?.cat?.en || '';
  document.getElementById('car-gear-tr').value = car?.gear?.tr || '';
  document.getElementById('car-gear-en').value = car?.gear?.en || '';
  document.getElementById('car-img').value = car?.img || '';
  document.getElementById('car-turo').value = car?.turoUrl || '';
  document.getElementById('car-modal').classList.remove('hidden');
}

function closeCarModal() { document.getElementById('car-modal').classList.add('hidden'); }
document.getElementById('car-img-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById('car-img-status');
  status.textContent = 'Yükleniyor...';
  status.classList.remove('hidden');
  try {
    const res = await fetch(`${API}/upload`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'X-Filename': file.name,
        'X-Content-Type': file.type
      },
      body: file
    });
    const data = await res.json();
    if (data.url) {
      document.getElementById('car-img').value = data.url;
      status.textContent = 'Yüklendi!';
      status.classList.add('text-green-400');
      setTimeout(() => { status.classList.add('hidden'); status.classList.remove('text-green-400'); }, 2000);
    } else {
      status.textContent = 'Hata: ' + (data.error || 'Yükleme başarısız');
      status.classList.add('text-red-400');
    }
  } catch (err) {
    status.textContent = 'Hata: Yükleme başarısız';
    status.classList.add('text-red-400');
  }
  e.target.value = '';
});

function openFaqModal(faq = null, index = -1) {
  document.getElementById('faq-modal-title').textContent = faq ? 'Soru Düzenle' : 'Yeni Soru';
  document.getElementById('faq-id').value = index;
  document.getElementById('faq-q-tr').value = faq?.q?.tr || '';
  document.getElementById('faq-q-en').value = faq?.q?.en || '';
  document.getElementById('faq-a-tr').value = faq?.a?.tr || '';
  document.getElementById('faq-a-en').value = faq?.a?.en || '';
  document.getElementById('faq-modal').classList.remove('hidden');
}

function closeFaqModal() { document.getElementById('faq-modal').classList.add('hidden'); }
document.getElementById('add-faq-btn').addEventListener('click', () => openFaqModal());

function esc(str) { return (str || '').replace(/"/g, '&quot;'); }

function renderContentEditor() {
  const editor = document.getElementById('content-editor');
  editor.innerHTML = CONTENT_SCHEMA.map(s => {
    let html = `<div class="bg-[#1C1813] border border-[#2A2620] rounded-lg p-5">
      <h3 class="text-sm font-semibold text-[#C2A05A] mb-4">${s.label}</h3>
      <div class="space-y-4">`;

    html += s.fields.map(f => {
      const val = contentData[s.key]?.[f.id];
      if (s.single) {
        return `<div>
          <label class="text-[11px] text-[#8B847A] mb-1.5 block uppercase tracking-wider">${f.label}</label>
          ${f.type === 'textarea'
            ? `<textarea rows="2" data-path="${s.key}.${f.id}" placeholder="${f.label}" class="w-full px-3 py-2.5 rounded-lg text-sm">${esc(val)}</textarea>`
            : `<input type="text" data-path="${s.key}.${f.id}" value="${esc(val)}" placeholder="${f.label}" class="w-full px-3 py-2.5 rounded-lg text-sm"/>`}
        </div>`;
      }
      return `<div>
        <label class="text-[11px] text-[#8B847A] mb-1.5 block uppercase tracking-wider">${f.label}</label>
        <div class="grid grid-cols-2 gap-3">
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-[10px] text-[#C2A05A] font-medium pointer-events-none">TR</span>
            ${f.type === 'textarea'
              ? `<textarea rows="2" data-path="${s.key}.${f.id}.tr" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm">${esc(val?.tr)}</textarea>`
              : `<input type="text" data-path="${s.key}.${f.id}.tr" value="${esc(val?.tr)}" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm"/>`}
          </div>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-[10px] text-[#C2A05A] font-medium pointer-events-none">EN</span>
            ${f.type === 'textarea'
              ? `<textarea rows="2" data-path="${s.key}.${f.id}.en" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm">${esc(val?.en)}</textarea>`
              : `<input type="text" data-path="${s.key}.${f.id}.en" value="${esc(val?.en)}" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm"/>`}
          </div>
        </div>
      </div>`;
    }).join('');

    if (s.items) {
      const items = contentData[s.key]?.items || [];
      html += items.map((item, idx) => `
        <div class="mt-2 pl-4 border-l-2 border-[#2A2620]">
          <div class="text-[11px] text-[#8B847A] mb-2 uppercase tracking-wider">${s.items.label} ${idx + 1}</div>
          ${s.items.fields.map(f => {
            const v = item[f.id];
            return `<div class="mb-3">
              <label class="text-[11px] text-[#8B847A] mb-1 block">${f.label}</label>
              <div class="grid grid-cols-2 gap-3">
                <div class="relative">
                  <span class="absolute left-3 top-2.5 text-[10px] text-[#C2A05A] font-medium pointer-events-none">TR</span>
                  ${f.type === 'textarea'
                    ? `<textarea rows="2" data-path="${s.key}.items.${idx}.${f.id}.tr" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm">${esc(v?.tr)}</textarea>`
                    : `<input type="text" data-path="${s.key}.items.${idx}.${f.id}.tr" value="${esc(v?.tr)}" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm"/>`}
                </div>
                <div class="relative">
                  <span class="absolute left-3 top-2.5 text-[10px] text-[#C2A05A] font-medium pointer-events-none">EN</span>
                  ${f.type === 'textarea'
                    ? `<textarea rows="2" data-path="${s.key}.items.${idx}.${f.id}.en" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm">${esc(v?.en)}</textarea>`
                    : `<input type="text" data-path="${s.key}.items.${idx}.${f.id}.en" value="${esc(v?.en)}" class="w-full pl-9 pr-3 py-2.5 rounded-lg text-sm"/>`}
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>
      `).join('');
    }

    html += `</div></div>`;
    return html;
  }).join('');
}

document.getElementById('save-content-btn').addEventListener('click', async () => {
  document.querySelectorAll('[data-path]').forEach(el => {
    const parts = el.dataset.path.split('.');
    let obj = contentData;
    for (let i = 0; i < parts.length - 1; i++) {
      const key = parts[i];
      const nextKey = parts[i + 1];
      if (!isNaN(nextKey)) {
        if (!Array.isArray(obj[key])) obj[key] = [];
        while (obj[key].length <= parseInt(nextKey)) obj[key].push({});
        obj = obj[key];
        continue;
      }
      if (!obj[key]) obj[key] = {};
      obj = obj[key];
    }
    obj[parts[parts.length - 1]] = el.value;
  });
  await api(devMode ? '/siteContent' : '/content', 'PUT', contentData);
  showToast('İçerik kaydedildi');
});
